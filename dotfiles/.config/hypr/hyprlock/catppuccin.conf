# Catppuccin Mocha fallback for hyprlock.conf. The generated palette for the active theme
# variant (~/.config/hss-theme/generated/hyprlock/colors.conf) is sourced afterwards and
# overrides these values.
$hss_bg = rgba(1e1e2eff)
$hss_fg = rgba(cdd6f4ff)
$hss_fg_muted = rgba(a6adc8ff)
$hss_input_bg = rgba(1e1e2ed9)
$hss_accent = rgba(89b4faff)
$hss_focus = rgba(89b4faff)
$hss_warning = rgba(f9e2afff)
$hss_error = rgba(f38ba8ff)
$hss_shadow = rgba(11111b99)
$hss_font_ui = Noto Sans
$hss_font_mono = JetBrainsMono Nerd Font

# Earlier variable names, kept for configurations that still reference them.
$color0 = rgb(30, 30, 46)     # dark bg
$color1 = rgb(24, 24, 37)     # darker bg
$color2 = rgb(205, 214, 244)  # foreground
$color3 = rgb(243, 139, 168)  # red
$color4 = rgb(166, 227, 161)  # green
$color5 = rgb(249, 226, 175)  # yellow
$color6 = rgb(137, 180, 250)  # blue
$color7 = rgb(203, 166, 247)  # magenta
$color8 = rgb(137, 220, 235)  # cyan
