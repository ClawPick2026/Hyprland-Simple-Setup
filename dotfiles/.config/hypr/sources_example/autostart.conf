# Start the managed authentication agent (Hyprpolkitagent); a foreign agent is reported, never stopped
exec-once = $hyprscripts/action_exec.sh --quiet session.auth.start
exec-once = hyprctl keyword input:kb_numlock true && $hyprscripts/startup_state.sh mark numlock

# Static Wallpaper
exec-once = hyprpaper &
exec-once = $hyprscripts/change_wallpaper.sh &

# Persistent Clipboard
exec-once = wl-clip-persist --clipboard regular &
exec-once = wl-clipboard-history -t &

# Start Idle Manager
exec-once = hypridle &

# Cursor theme
exec-once = hyprctl setcursor $cursor 24

# Start Waybar
exec-once = sleep 1; "$HOME/.config/waybar/scripts/waybar_launch.sh" &

exec-once = sleep 1; $hyprscripts/Startup_check.sh &

# Start Apps Workspace 1:
exec-once = [workspace 1 silent] $editor

# Start Apps Workspace 2:
exec-once = [workspace 2 silent] $browser &

# XWayland video bridge (installed by setup; helps screen sharing on XWayland apps)
exec-once = systemctl --user start app-org.kde.xwaylandvideobridge@autostart.service &

# Optional extras (commented in the example to avoid assuming package availability)
