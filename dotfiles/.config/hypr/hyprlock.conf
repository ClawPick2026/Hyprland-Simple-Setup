# Colors: the Catppuccin Mocha fallback first, then the generated palette of the active theme
# variant. "noerror" keeps hyprlock quiet when the theme has not been applied yet.
source = ~/.config/hypr/hyprlock/catppuccin.conf
# hyprlang noerror true
source = ~/.config/hss-theme/generated/hyprlock/colors.conf
# hyprlang noerror false

general {
    hide_cursor = false
}

# The wallpaper is selected dynamically, so no stable image path exists in config.
# Capture the current desktop when locking instead of passing a directory to hyprlock.
background {
    monitor =
    path = screenshot
    blur_passes = 2
    color = $hss_bg
}

# Outline: accent while typing, warning while checking, error after a failed attempt.
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $hss_input_bg
    outer_color = $hss_focus
    check_color = $hss_warning
    fail_color = $hss_error
    capslock_color = $hss_warning
    font_color = $hss_fg
    font_family = $hss_font_ui
    fade_on_empty = false
    rounding = 12

    placeholder_text = <i>Password</i>
    fail_text = <b>$PAMFAIL</b>

    position = 0, -170
    halign = center
    valign = center
}

# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H:%M:%S")</big></b>"
    color = $hss_fg
    font_size = 64
    font_family = $hss_font_mono
    shadow_passes = 1
    shadow_color = $hss_shadow
    position = 0, -60
    halign = center
    valign = center
}

# Current date
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%A, %d %B %Y")</b>"
    color = $hss_fg
    font_size = 20
    font_family = $hss_font_ui
    shadow_passes = 1
    shadow_color = $hss_shadow
    position = 0, 0
    halign = center
    valign = center
}
