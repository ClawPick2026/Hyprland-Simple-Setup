open_url_with default

kitty_mod ctrl+shift
kitty_mod1 alt
kitty_mod2 shift
kitty_mod3 ctrl

# Syntax highlighting (requires bat for viewing files)
map kitty_mod+b launch --keep-focus bat --paging=always --style=full --color=always

# Case-insensitive search in terminal (requires less or grep)
map kitty_mod+f launch --keep-focus grep -i

# Application content stays opaque (desktop theme policy P02).
background_opacity 1.0

# Scrolling and buffer size
scrollback_lines 10000

# Enable autocomplete (requires shell support like zsh or fish)
shell /usr/bin/fish

# Reload config without restarting Kitty
map kitty_mod+r reload_config

# Performance
repaint_delay                   6
input_delay                     1
sync_to_monitor                 no

# Font settings. The theme include below sets the same family; font_size stays yours.
font_family                     JetBrainsMono Nerd Font
bold_font                       auto
italic_font                     auto
bold_italic_font                auto
font_size                       14
disable_ligatures               never
adjust_line_height              1

# Mouse
copy_on_select                  yes
strip_trailing_spaces           always

# Cursor
cursor_shape                    block
cursor_blink_interval           0

# Window layout
window_border_width             1px
hide_window_decorations         titlebar-only

# Bell
enable_audio_bell               no
window_alert_on_bell            yes
bell_on_tab                     no

# Tab Bar
tab_bar_edge                    bottom
tab_bar_style                   powerline
tab_powerline_style             angled
tab_bar_min_tabs                1
tab_bar_align                   left

# Advance
shell_integration               enabled no-cursor
update_check_interval           0

# Colours come from the generated Catppuccin theme included at the end of this file.

####### Keyboard Shortcuts #######

# Misc
map ctrl+space launch --cwd=current gitui
map ctrl+v paste_from_clipboard

# Tab management
map kitty_mod+y new_tab
map alt+y close_tab    

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Window management
map kitty_mod+x new_window_with_cwd
map alt+x close_window
map alt+v toggle_layout tall
map alt+s toggle_layout grid

map alt+h neighboring_window left
map alt+j neighboring_window bottom
map alt+k neighboring_window top
map alt+l neighboring_window right

map alt+shift+h move_window left
map alt+shift+j move_window bottom
map alt+shift+k move_window top
map alt+shift+l move_window right
 
map alt+shift+1 move_window left
map alt+shift+2 move_window bottom
map alt+shift+3 move_window top
map alt+shift+4 move_window right
map alt+shift+5 move_window right
map alt+shift+6 move_window right
map alt+shift+7 move_window right
map alt+shift+8 move_window right
map alt+shift+9 move_window right
map kitty_mod+f4 detach_window ask

# Font size change
map ctrl+1 change_font_size all +2.0
map ctrl+2 change_font_size all -2.0

# Scrolling
map page_up scroll_page_up
map page_down scroll_page_down
map shift+page_up combine : scroll_page_up : scroll_page_up : scroll_page_up
map shift+page_down combine : scroll_page_down : scroll_page_down : scroll_page_down


# Optional background image (disabled so terminal text stays on the theme background):
# background_image ~/.config/kitty/Background/VDawg.png
# background_image_layout cscaled
# background_tint 0.5

# Catppuccin Mocha/Latte colours and font family, switched with Super+Shift+T. Included
# last so it takes precedence; put your own colour overrides after this region.
# >>> hss-theme:kitty >>>
include ~/.config/hss-theme/generated/kitty/theme.conf
# <<< hss-theme:kitty <<<
