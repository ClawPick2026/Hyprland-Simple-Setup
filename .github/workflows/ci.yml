name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish jq lua5.4 shellcheck desktop-file-utils
      - name: Check shell scripts and run guarded scenarios
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(find scripts/lib tests -type f -name '*.sh' -print0 | sort -z)
          role_scripts=(
            dotfiles/.config/hypr/scripts/float_calendar.sh
            dotfiles/.config/hypr/scripts/menu_exec.sh
            dotfiles/.config/hypr/scripts/notes.sh
            dotfiles/.config/hypr/scripts/repos_wofi.sh
            dotfiles/.config/hypr/scripts/term_exec.sh
            dotfiles/.config/hypr/scripts/toggle_floating.sh
            dotfiles/.config/waybar/scripts/brightness.sh
            dotfiles/.config/waybar/scripts/clipboard.sh
            dotfiles/.config/waybar/scripts/clipboard_pick.sh
            dotfiles/.config/waybar/scripts/waybar_launch.sh
            dotfiles/.config/waybar/scripts/weather.sh
          )
          # Shared runtime entry points, source-only libraries and providers (plans F02/F04).
          runtime_scripts=(
            dotfiles/.config/hypr/scripts/action_exec.sh
            dotfiles/.config/hypr/scripts/status_read.sh
            dotfiles/.config/hypr/scripts/menu_choose.sh
            dotfiles/.config/hypr/scripts/window_present.sh
            dotfiles/.config/hypr/scripts/window_place.sh
            dotfiles/.config/hypr/scripts/nwg_dock.sh
            dotfiles/.config/hypr/scripts/dock_pins.sh
            dotfiles/.config/hypr/scripts/nwg_panel.sh
            dotfiles/.config/hypr/scripts/role_exec.sh
            dotfiles/.config/hypr/scripts/role_window.sh
            dotfiles/.config/hypr/scripts/toggle_bluetooth.sh
            dotfiles/.config/hypr/scripts/hyprsunset.sh
            dotfiles/.config/waybar/scripts/notification_status.sh
            dotfiles/.config/waybar/scripts/theme_status.sh
            dotfiles/.config/waybar/scripts/hardware_state.sh
            dotfiles/.config/waybar/scripts/bar_status.sh
            dotfiles/.config/waybar/scripts/power_action.sh
            dotfiles/.config/waybar/scripts/launch_power_screen.sh
            dotfiles/.config/hypr/scripts/lib/*.sh
            dotfiles/.config/hypr/scripts/providers/*.sh
          )
          bash_files=(setup.sh install.sh "${shell_files[@]}" "${role_scripts[@]}" "${runtime_scripts[@]}")
          for file in "${bash_files[@]}"; do
            bash -n "$file"
          done
          shellcheck -x "${bash_files[@]}"
          python3 dotfiles/.config/hypr/theme/hss_theme.py check
          # Offline functional checks only: graphical, VM and hardware evidence is collected
          # manually (tests/fixtures/harmonization/visual-protocol.md), never in CI.
          tests/run.sh
      - name: Test official-installer fixtures with Dash and Bash
        shell: bash
        run: |
          set -euo pipefail
          for interpreter in /bin/dash /bin/bash; do
            HSS_TEST_INSTALLER_SH="$interpreter" tests/run.sh tests/shell/agent_installers.sh
          done

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package registry
        run: |
          jq -e . packages.json >/dev/null
          tests/check_packages_json.sh
